<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Checador Facial · Saint Luke's</title>
  <!-- Face-API.js desde CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  
  <style>
    :root { --primary: #07345b; --accent: #0b6796; --bg: #f2f6fa; --success: #126544; --error: #b22e35; }
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { margin: 0; background: var(--bg); color: #163047; padding-bottom: 40px; }
    
    header { background: var(--primary); color: white; padding: 20px; text-align: center; }
    header h1 { margin: 0; font-size: 20px; }
    
    main { max-width: 600px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    
    input, select { width: 100%; padding: 12px; border: 1px solid #becfdc; border-radius: 8px; font-size: 16px; margin-bottom: 12px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; background: var(--accent); color: white; }
    .btn:disabled { background: #a0c4d9; }
    
    .camera-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; }
    video { width: 100%; display: block; transform: scaleX(-1); }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    
    .status-msg { padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; margin-top: 12px; display: none; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .loading { background: #e2e3e5; color: #383d41; }
    
    [hidden] { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>GRUPO SAINT LUKE'S HOSPITALS</h1>
  <p>Checador facial · Validación biométrica</p>
</header>

<main>
  <!-- PASO 1: Identificación -->
  <div class="card" id="step1">
    <h2>Datos del colaborador</h2>
    <input type="text" id="numeroEmpleado" placeholder="Número de empleado" inputmode="numeric">
    <button class="btn" id="btnBuscar" onclick="buscarEmpleado()">Buscar datos</button>
    <div id="msgBuscar" class="status-msg"></div>
  </div>

  <!-- PASO 2: Movimiento -->
  <div class="card" id="step2" hidden>
    <div style="background:#e4f5ed; padding:12px; border-radius:8px; margin-bottom:16px;">
      <strong>Colaborador:</strong> <span id="txtNombre"></span><br>
      <strong>Sede:</strong> <span id="txtSede"></span>
    </div>
    <label>Tipo de registro:</label>
    <select id="movimiento">
      <option value="Entrada">🟢 Entrada</option>
      <option value="Salida">🔴 Salida</option>
    </select>
    <button class="btn" onclick="iniciarCamara()">Activar cámara y validar ubicación</button>
  </div>

  <!-- PASO 3: Cámara -->
  <div class="card" id="step3" hidden>
    <h2>Validación facial</h2>
    <div class="camera-container">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvasOverlay"></canvas>
    </div>
    <ul style="list-style:none; padding:0; font-size:14px; margin:16px 0;">
      <li id="chkGps">⏳ Obteniendo ubicación GPS...</li>
      <li id="chkFace">⏳ Esperando activación de cámara...</li>
      <li id="chkMatch">⏳ Validación de rostro pendiente</li>
    </ul>
    <button class="btn" id="btnCapturar" onclick="capturarYValidar()" disabled>Capturar y validar</button>
    <button class="btn" style="background:#e4eef5; color:#07345b; margin-top:8px;" onclick="reiniciarProceso()">Cancelar</button>
    <div id="msgValidacion" class="status-msg"></div>
  </div>

  <!-- PASO 4: Confirmación -->
  <div class="card" id="step4" hidden>
    <h2>Confirmar registro</h2>
    <p>Se registrará tu <strong id="confMovimiento"></strong> a las <strong id="confHora"></strong></p>
    <button class="btn" id="btnRegistrar" onclick="enviarRegistro()">Registrar asistencia</button>
    <button class="btn" style="background:#e4eef5; color:#07345b; margin-top:8px;" onclick="reiniciarProceso()">Nuevo registro</button>
    <div id="msgFinal" class="status-msg"></div>
  </div>
</main>

<script>
  // ⚙️ CONFIGURACIÓN DEL SISTEMA
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzYWmvw3c0QMafg4WHzYzPNTIgKiZyuJcO9LeQzeCgwljKYvYlYNDAXknYFCTV_-NBC9A/exec";
  const API_SECRET = "SLH_2026_X9Y"; 
  const MODELS_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model";

  let empleadoActual = null;
  let streamCamara = null;
  let datosGPS = null;
  let rostroValidado = false;
  let fotoBase64 = "";

  // Inicializar Face-API al cargar
  window.onload = async () => {
    mostrarMsg('msgBuscar', 'Cargando modelos de IA...', 'loading');
    try {
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODELS_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODELS_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODELS_URL);
      mostrarMsg('msgBuscar', 'Sistema listo. Ingresa tu número.', 'success');
    } catch (err) {
      mostrarMsg('msgBuscar', 'Error cargando modelos. Revisa tu conexión.', 'error');
    }
  };

  async function buscarEmpleado() {
    const num = document.getElementById('numeroEmpleado').value.trim();
    if (!num) return mostrarMsg('msgBuscar', 'Ingresa un número.', 'error');
    
    mostrarMsg('msgBuscar', 'Buscando...', 'loading');
    document.getElementById('btnBuscar').disabled = true;

    try {
      const url = `${WEB_APP_URL}?action=empleado&numero=${encodeURIComponent(num)}&key=${API_SECRET}`;
      const res = await fetch(url);
      const data = await res.json();
      
      if (data.encontrado) {
        empleadoActual = data;
        document.getElementById('txtNombre').textContent = data.nombre;
        document.getElementById('txtSede').textContent = data.sede;
        document.getElementById('step1').hidden = true;
        document.getElementById('step2').hidden = false;
        obtenerGPS(); // Iniciar GPS en segundo plano
      } else {
        mostrarMsg('msgBuscar', 'Empleado no encontrado.', 'error');
      }
    } catch (err) {
      mostrarMsg('msgBuscar', 'Error de conexión con el servidor.', 'error');
    } finally {
      document.getElementById('btnBuscar').disabled = false;
    }
  }

  function obtenerGPS() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        datosGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude, precision: pos.coords.accuracy };
        document.getElementById('chkGps').textContent = "✅ Ubicación GPS obtenida";
        document.getElementById('chkGps').style.color = "var(--success)";
      },
      () => {
        document.getElementById('chkGps').textContent = "⚠️ GPS no disponible";
        datosGPS = { lat: 0, lng: 0, precision: 9999 };
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  async function iniciarCamara() {
    document.getElementById('step2').hidden = true;
    document.getElementById('step3').hidden = false;
    const video = document.getElementById('video');
    try {
      streamCamara = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      video.srcObject = streamCamara;
      video.onloadedmetadata = () => {
        document.getElementById('chkFace').textContent = "✅ Cámara activa";
        document.getElementById('chkFace').style.color = "var(--success)";
        document.getElementById('btnCapturar').disabled = false;
      };
    } catch (err) {
      document.getElementById('chkFace').textContent = "❌ Permiso de cámara denegado";
    }
  }

          // FUNCIÓN AUXILIAR: Redimensiona imagen base64 a máximo 600x600px
  function redimensionarImagenBase64(dataUri, maxAncho = 600, maxAlto = 600) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let ancho = img.width;
        let alto = img.height;
        
        // Calcular proporción manteniendo aspect ratio
        if (ancho > maxAncho || alto > maxAlto) {
          const ratio = Math.min(maxAncho / ancho, maxAlto / alto);
          ancho = Math.floor(ancho * ratio);
          alto = Math.floor(alto * ratio);
        }
        
        const canvas = document.createElement('canvas');
        canvas.width = ancho;
        canvas.height = alto;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, ancho, alto);
        
        // Comprimir a JPEG 85% para reducir tamaño
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('No se pudo cargar la imagen'));
      img.src = dataUri;
    });
  }

  async function capturarYValidar() {
    const btn = document.getElementById('btnCapturar');
    const msgVal = document.getElementById('msgValidacion');
    
    btn.disabled = true; 
    btn.textContent = "⏳ Procesando...";
    msgVal.className = 'status-msg loading';
    msgVal.style.display = 'block';
    msgVal.textContent = "Analizando biometría...";
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvasOverlay');
    canvas.width = video.videoWidth; 
    canvas.height = video.videoHeight;
    
    try {
      // 1. DETECCIÓN DEL ROSTRO EN VIVO
      const deteccion = await faceapi.detectSingleFace(
        video, 
        new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 })
      ).withFaceLandmarks().withFaceDescriptor();

      if (!deteccion) {
        msgVal.className = 'status-msg error';
        msgVal.textContent = "❌ No se detectó rostro. Acerca tu cara o mejora la luz.";
        btn.disabled = false; 
        btn.textContent = "Reintentar captura";
        return; 
      }

      // Dibujar cuadro de confirmación
      const displaySize = { width: canvas.width, height: canvas.height };
      faceapi.matchDimensions(canvas, displaySize);
      const resizedDetections = faceapi.resizeResults(deteccion, displaySize);
      faceapi.draw.drawDetections(canvas, resizedDetections);

      // 2. VALIDACIÓN CONTRA REFERENCIA (CON REDIMENSIONAMIENTO)
      let matchExitoso = false;
      let mensajeMatch = "";
      let modoSupervision = false;
      const UMBRAL_SENSIBILIDAD = 0.48; 

      if (empleadoActual.fotoUrl && empleadoActual.fotoUrl.startsWith('data:image')) {
        msgVal.textContent = "Procesando foto de referencia...";
        
        try {
          // ⭐ CLAVE: Redimensionar la foto ANTES de pasarla a face-api
          // Esto reduce el tamaño de 3-5MB a ~50KB y evita errores de memoria
          const fotoRedimensionada = await redimensionarImagenBase64(
            empleadoActual.fotoUrl, 
            600, 600
          );
          
          msgVal.textContent = "Comparando rostros...";
          
          const imgRef = await faceapi.fetchImage(fotoRedimensionada);
          const deteccionRef = await faceapi.detectSingleFace(
            imgRef, 
            new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.3 })
          ).withFaceDescriptor();
          
          if (deteccionRef) {
            const matcher = new faceapi.FaceMatcher(
              [new faceapi.LabeledFaceDescriptors(empleadoActual.numero, [deteccionRef.descriptor])], 
              UMBRAL_SENSIBILIDAD
            );
            
            const match = matcher.findBestMatch(deteccion.descriptor);
            
            if (match.label === empleadoActual.numero) {
              matchExitoso = true;
              const porcentaje = Math.round((1 - match.distance) * 100);
              mensajeMatch = `✅ Rostro coincide (${porcentaje}% confianza)`;
            } else {
              mensajeMatch = `❌ Rostro NO coincide. Distancia: ${match.distance.toFixed(2)}`;
              modoSupervision = true;
            }
          } else {
            mensajeMatch = "⚠️ No se detectó rostro en foto de referencia";
            modoSupervision = true;
          }
        } catch (e) { 
          console.error("Error en validación:", e);
          mensajeMatch = "⚠️ Error técnico al validar foto de referencia";
          modoSupervision = true;
        }
      } else {
        mensajeMatch = "⚠️ SIN FOTO DE REFERENCIA";
        modoSupervision = true;
        matchExitoso = true;
      }

      // 3. ACTUALIZAR UI
      const chkMatch = document.getElementById('chkMatch');
      chkMatch.textContent = mensajeMatch;
      chkMatch.style.color = matchExitoso || modoSupervision ? "var(--success)" : "var(--error)";

      // 4. MODO SUPERVISIÓN: Permitir registro pero marcar para revisión
      if (!matchExitoso && modoSupervision) {
        msgVal.className = 'status-msg';
        msgVal.style.background = '#fff4db';
        msgVal.style.color = '#75510c';
        msgVal.textContent = "⚠️ Validación biométrica fallida. Se registrará para revisión manual de RH.";
        
        setTimeout(() => {
          if (confirm("Tu rostro no coincidió con la foto de referencia. ¿Deseas registrar tu asistencia de todos modos? RH revisará esta checada manualmente.")) {
            continuarRegistro(true);
          } else {
            btn.disabled = false;
            btn.textContent = "Reintentar validación";
            msgVal.style.display = 'none';
          }
        }, 500);
        return;
      }

      if (!matchExitoso && !modoSupervision) {
        msgVal.className = 'status-msg error';
        msgVal.textContent = "⛔ VALIDACIÓN FALLIDA. Intenta de nuevo o contacta a RH.";
        btn.disabled = false; 
        btn.textContent = "Reintentar validación";
        return; 
      }

      continuarRegistro(false);

    } catch (err) {
      console.error(err);
      msgVal.className = 'status-msg error';
      msgVal.textContent = "Error inesperado: " + err.message;
      btn.disabled = false;
      btn.textContent = "Reintentar";
    }
  }

  function continuarRegistro(modoSupervision) {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvasOverlay');
    
    rostroValidado = modoSupervision ? "SUPERVISION_RH" : true;
    
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);

    const msgVal = document.getElementById('msgValidacion');
    msgVal.className = 'status-msg success';
    msgVal.textContent = modoSupervision 
      ? "✅ Registro marcado para revisión de RH" 
      : "✅ ¡Validación exitosa!";

    setTimeout(() => {
      document.getElementById('step3').hidden = true;
      document.getElementById('step4').hidden = false;
      document.getElementById('confMovimiento').textContent = document.getElementById('movimiento').value;
      document.getElementById('confHora').textContent = new Date().toLocaleTimeString();
      
      const chkGpsFinal = document.getElementById('chkGpsFinal');
      if (datosGPS) {
        chkGpsFinal.textContent = `✅ GPS: Precisión ${Math.round(datosGPS.precision)}m`;
      } else {
        chkGpsFinal.textContent = "⚠️ Sin ubicación GPS";
      }
    }, 800);
  }

  async function enviarRegistro() {
    const btn = document.getElementById('btnRegistrar');
    btn.disabled = true; btn.textContent = "Enviando...";
    
    const payload = {
      tipo: "registro",
      api_key: API_SECRET,
      numeroEmpleado: empleadoActual.numero,
      nombre: empleadoActual.nombre,
      movimiento: document.getElementById('movimiento').value,
      sede: empleadoActual.sede,
      lat: datosGPS ? datosGPS.lat : 0,
      lng: datosGPS ? datosGPS.lng : 0,
      precision: datosGPS ? datosGPS.precision : 9999,
      dentroDeRadio: true,
      rostroValidado: rostroValidado,
      horaDispositivo: new Date().toISOString(),
      fotoBase64: fotoBase64
    };

    try {
      await fetch(WEB_APP_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      mostrarMsg('msgFinal', '✅ Registro guardado exitosamente.', 'success');
      if (streamCamara) streamCamara.getTracks().forEach(t => t.stop());
    } catch (err) {
      mostrarMsg('msgFinal', '❌ Error de red.', 'error');
      btn.disabled = false; btn.textContent = "Reintentar";
    }
  }

  function reiniciarProceso() {
    if (streamCamara) streamCamara.getTracks().forEach(t => t.stop());
    document.getElementById('numeroEmpleado').value = '';
    document.getElementById('step1').hidden = false;
    document.getElementById('step2').hidden = true;
    document.getElementById('step3').hidden = true;
    document.getElementById('step4').hidden = true;
    empleadoActual = null; datosGPS = null; rostroValidado = false;
  }

  function mostrarMsg(id, txt, tipo) {
    const el = document.getElementById(id);
    el.textContent = txt; el.className = `status-msg ${tipo}`; el.style.display = 'block';
  }
</script>
</body>
</html>
